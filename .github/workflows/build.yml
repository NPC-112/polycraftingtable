name: Build mod

on:
  # README and other documentation-only edits do not need a mod build.
  # Keep code, resources, tests, build inputs, CI checks, and workflow edits covered.
  push:
    paths:
      - 'src/**'
      - 'build.gradle'
      - '**/*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build.gradle'
      - '**/*.gradle'
      - 'gradle.properties'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.8.2"

      - name: Build Fabric mod
        run: gradle --no-daemon build

      - name: Upload mod jars
        uses: actions/upload-artifact@v7
        with:
          name: polymer-crafting-table
          path: build/libs/*.jar
          if-no-files-found: error

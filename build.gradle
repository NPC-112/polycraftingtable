plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
}

group = project.maven_group
version = "${project.mod_version}+${project.minecraft_version}"

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = "Nucleoid"
        url = "https://maven.nucleoid.xyz/releases"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    compileOnly "eu.pb4:polymer-core:${project.polymer_version}"
    compileOnly "eu.pb4:polymer-resource-pack:${project.polymer_version}"
    compileOnly "eu.pb4:polymer-resource-pack-extras:${project.polymer_version}"
    compileOnly "eu.pb4:sgui:${project.sgui_version}"
    compileOnly "maven.modrinth:polydex:${project.polydex_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation "com.google.code.gson:gson:2.14.0"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat = "full"
    }
}
